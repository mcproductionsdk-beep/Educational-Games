<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boring Teacher — Sentence Games</title><style>
*{box-sizing:border-box}body{margin:0;background:#10192e;color:#f2f7ff;font:700 15px 'Courier New',monospace}.wrap{max-width:960px;margin:20px auto;padding:0 14px}.head{text-align:center;border:3px solid #456483;border-radius:16px;background:#17243a;padding:15px 12px;margin-bottom:12px}h1{font-size:clamp(21px,3vw,29px);margin:0;color:#55dcff}h2{font-size:20px;margin:0 0 7px}small{color:#7ce4ff}.panel{background:#20314b;border:3px solid #526f90;border-radius:10px;padding:17px}p{line-height:1.5}.hint{color:#b9d4e8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.card{display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center;padding:12px 8px;border:3px solid #6ee7b7;border-radius:4px;background:#172b47;color:#f2f7ff;text-decoration:none;min-height:118px}.card:hover,.card:focus-visible{background:#274a61;outline:3px solid #55dcff;outline-offset:2px}.card[aria-disabled=true]{opacity:.5;pointer-events:none}.icon{font-size:30px}.name{font-size:15px}.play{color:#6ee7b7;font-size:13px}.meta{border-top:3px dashed #526f90;padding-top:12px;display:flex;gap:12px;flex-wrap:wrap}.status{color:#6ee7b7}.error{color:#ff9ba6}input,button{font:inherit;background:#10192e;color:white;border:2px solid #6486a8;padding:7px 9px}button{cursor:pointer;background:#167c77;border-color:#6ee7b7}label{display:block;margin:10px 0 6px}.load{display:flex;gap:8px;flex-wrap:wrap}input{min-width:200px;max-width:100%}@media(max-width:700px){.wrap{margin:10px auto}.cards{grid-template-columns:1fr}.card{min-height:0;flex-direction:row;text-align:left;justify-content:space-between}.icon{font-size:32px}.name{font-size:16px}.panel{padding:16px}}</style></head>
<body><main class="wrap"><header class="head"><h1>★ BORING TEACHER ★</h1><p><small>SENTENCE SET · CHOOSE YOUR GAME</small></p></header><section class="panel"><h2>Choose a game</h2><p class="hint">Sentences loaded. Choose a game.</p><div class="cards"><a class="card" data-game="sentences-invaders" aria-disabled="true"><span class="icon">👾</span><span class="name">Sentence Invaders</span><span class="play">▶ PLAY</span></a><a class="card" data-game="sentence-eater" aria-disabled="true"><span class="icon">🟡</span><span class="name">Sentence Eater</span><span class="play">▶ PLAY</span></a><a class="card" data-game="sentence-warehouse" aria-disabled="true"><span class="icon">📦</span><span class="name">Sentence Warehouse</span><span class="play">▶ PLAY</span></a></div><div class="meta"><strong id="title">No sentence set loaded</strong><span id="id"></span><span id="lang"></span><span id="count"></span></div><p id="status" class="status" role="status">Enter a sentence set ID to load your teacher's sentences.</p><label for="setId">Sentence Set ID</label><div class="load"><input id="setId" placeholder="SXXXXXXXX" autocomplete="off"><button id="load">LOAD</button></div></section></main>
<script>
'use strict';const API='https://boringteacher-sentences-api-staging.mcproductionsdk.workers.dev';const $=id=>document.getElementById(id);const cards=[...document.querySelectorAll('[data-game]')];let sequence=0;function disable(){cards.forEach(a=>{a.setAttribute('aria-disabled','true');a.removeAttribute('href')})}function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':'status'}async function load(id){const current=++sequence;disable();$('title').textContent='Loading…';$('id').textContent='';$('lang').textContent='';$('count').textContent='';if(!/^S[A-HJ-NP-Z2-9]{8}$/i.test(id)){status('Invalid sentence set ID.',true);$('title').textContent='No sentence set loaded';return}status('Loading sentence set…');try{const response=await fetch(API+'/sentence-sets/'+encodeURIComponent(id));const data=await response.json();if(current!==sequence)return;if(!response.ok||!data.set)throw Error(data.error||'Set not found');const set=data.set;if(!Array.isArray(set.pairs)||set.pairs.length<2||!set.pairs.every(p=>Array.isArray(p)&&p.length===2))throw Error('Invalid sentence data');$('title').textContent=set.title||'Custom Sentences';$('id').textContent='Set ID: '+id;$('lang').textContent='Language: '+set.language;$('count').textContent='Sentences: '+set.pairs.length;cards.forEach(a=>{a.href='https://boringteacher.com/'+a.dataset.game+'/#set='+encodeURIComponent(id);a.removeAttribute('aria-disabled')});status('Ready to play. Choose any game.');history.replaceState(null,'','#set='+encodeURIComponent(id))}catch(e){if(current!==sequence)return;$('title').textContent='Unable to load set';status('Could not load this set: '+e.message,true)}}$('load').addEventListener('click',()=>load($('setId').value.trim()));$('setId').addEventListener('keydown',e=>{if(e.key==='Enter')load(e.target.value.trim())});const id=new URLSearchParams(location.hash.slice(1)).get('set');if(id){$('setId').value=id;load(id)}
</script></body></html>
