name: Staging live verification
on:
  push:
    branches: ['feature/central-runtime-config-20261104']
    paths: ['platform/staging/verification-target.json']
permissions:
  contents: read
jobs:
  live-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Verify deployed staging journey
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          node platform/tests/staging-live.mjs
