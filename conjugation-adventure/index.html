<body>
<div id="shell">
<canvas id="game" width="960" height="540"></canvas>
<div id="hud"><span id="health"></span><span id="status"></span></div>
<div id="objective"></div>
<div id="bubble" class="hidden"><div id="speaker"></div><div id="content"></div></div>
<div id="toast" class="hidden"></div>
<div id="recon" class="hidden"></div>
<div id="bossPrompt" class="hidden"></div><div id="premise" class="hidden"><div id="premiseCard"><button id="closePremise" aria-label="Close">×</button><h2 id="premiseTitle"></h2><p id="premiseText"></p></div></div>
<button id="menuBtn" class="hidden">MAIN MENU</button><button id="skipBattleBtn" class="hidden" type="button">⚔ GO STRAIGHT INTO BATTLE</button>
<div id="start" class="overlay"><div class="card questMenu">
<header class="menuHeader"><div><h1>LANGUAGE QUESTS</h1><div class="sub">Mysteries · Riddles · Adventures</div></div><span class="prototypeTag">MENU PROTOTYPE</span></header>
<div class="setupGrid">
<section class="panel"><h2>BUILT-IN ADVENTURES</h2>
<div class="field"><label for="languageSelect">LANGUAGE</label><select id="languageSelect"><option value="en-GB">English</option><option value="es-ES">Español</option><option value="de-DE">Deutsch</option></select></div>
<div class="field"><label for="adventureSelect">CHOOSE AN ADVENTURE</label><select id="adventureSelect"></select></div>
<h3>TERMS & DESCRIPTIONS</h3><textarea id="vocabPreview" class="vocabBox" readonly></textarea><div class="sub adventureDescription" id="adventureBlurb"></div>

<div class="characterSection embeddedCharacters"><h2>CHOOSE YOUR CHARACTER</h2><div class="heroes">
<button class="heroChoice selected" data-h="0"><canvas class="preview" width="52" height="70"></canvas><span class="heroName">Scientist</span></button>
<button class="heroChoice" data-h="1"><canvas class="preview" width="52" height="70"></canvas><span class="heroName">Metalhead</span></button>
<button class="heroChoice" data-h="2"><canvas class="preview" width="52" height="70"></canvas><span class="heroName">Worker</span></button>
<button class="heroChoice" data-h="3"><canvas class="preview" width="52" height="70"></canvas><span class="heroName">Flying Princess</span></button>
</div></div>
</section>
<section class="panel"><h2>STORY DETAILS & EDITOR</h2>
<div class="editorGrid"><div><label>Story title</label><input id="customTitle" value="The Lost Secret"></div><div><label>Correct mystery answer</label><input id="customIdentity" value="Thyra"></div></div>
<label>Final mystery question</label><input id="customFinalQuestion" value="Who is the mysterious person?">
<label>Story introduction</label><textarea id="customIntro" class="shortField">Five witnesses know clues about a mystery. Discover the answer.</textarea>
<label>Two incorrect mystery answers (one per line)</label><textarea id="customWrong" class="shortField">Harald Bluetooth
Cnut the Great</textarea>
<div class="clueHeading"><strong>FIVE CLUES</strong><span id="clueCounter">Clue 1 / 5</span></div>
<div class="clueTabs" id="clueTabs"></div>
<div class="clueFields">
<label>Question to ask the witness</label><textarea id="clueQuestion" class="shortField" placeholder="What happened here?"></textarea>
<label>Witness answer / clue</label><textarea id="clueAnswer" class="shortField" placeholder="I saw a mysterious figure near the laboratory."></textarea>
<label>Knowledge-check question</label><input id="clueCheck" placeholder="Where was the figure seen?">
<div class="answerGrid"><div><label>Answer A</label><input id="clueA" placeholder="Laboratory"></div><div><label>Answer B</label><input id="clueB" placeholder="Forest"></div><div><label>Answer C</label><input id="clueC" placeholder="Harbor"></div></div>
<label>Correct answer</label><select id="clueCorrect"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select>
</div>
<div class="editorActions"><button type="button" id="loadExample">LOAD EXAMPLE</button><button type="button" id="validateStory">CHECK FORMAT</button><button type="button" id="saveStory">SAVE & SELECT</button><button type="button" id="exportStory">COPY SCRIPT</button></div>
<div id="editorStatus" role="status"></div>
<textarea id="customRows" hidden></textarea>
</section></div>
<div class="startRow"><div class="sub">WASD / arrows to move · Click answers · Space to fire</div><button id="startGame" class="primary">START ADVENTURE →</button></div>
</div></div>

const WITNESS_FLEE_RADIUS=205, WITNESS_SPEED=117, WITNESS_CATCH_RADIUS=37;

function moveWitnesses(dt){
 for(let i=0;i<villagers.length;i++){
  if(completed.has(i))continue;
  const v=villagers[i],dx=v.x-player.x,dy=v.y-player.y,dist=Math.hypot(dx,dy);
  v.wanderTime=(v.wanderTime||0)-dt;
  if(v.wanderTime<=0){v.wanderAngle=Math.random()*Math.PI*2;v.wanderTime=.35+Math.random()*.85;}
  const fleeing=dist<WITNESS_FLEE_RADIUS&&dist>0.01;
  const direction=fleeing?Math.atan2(dy,dx)+Math.sin(performance.now()/300+i)*.18:v.wanderAngle;
  const speed=fleeing?WITNESS_SPEED:WANDER_SPEED;
  const step=speed*dt,ux=Math.cos(direction),uy=Math.sin(direction);
  const canStand=(x,y)=>x>=32&&x<=928&&y>=95&&y<=505&&!blocked(x,y);
  const candidates=[[v.x+ux*step,v.y+uy*step],[v.x+ux*step,v.y],[v.x,v.y+uy*step]];
  const next=candidates.find(([x,y])=>canStand(x,y));
  if(next){v.x=next[0];v.y=next[1];}
  else{v.wanderAngle+=Math.PI*(.55+Math.random()*.9);v.wanderTime=.3+Math.random()*.5;}
 }
}

function tone(f,d){try{audioCtx ||= new (AudioContext||webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type="square";g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
function speak(text){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text),vs=speechSynthesis.getVoices();u.lang=$("languageSelect").value;u.voice=vs.find(v=>v.lang.toLowerCase()===u.lang.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(u.lang.slice(0,2)))||null;u.rate=.9;speechSynthesis.speak(u)}catch{}} 
function speakSequence(lines){
 try{
  speechSynthesis.cancel();let vs=speechSynthesis.getVoices(),voice=vs.find(v=>v.lang.toLowerCase()===$("languageSelect").value.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith($("languageSelect").value.slice(0,2)))||null,i=0;

 }catch{}
}

"1\tWhen did this person live?\tThis person lived during the 10th century.\tWhich century?\t8th century\t10th century\t12th century\tB",
"2\tWhere was this person connected to?\tThis person is remembered at Jelling in Denmark.\tWhich place?\tJelling\tLondon\tParis\tA",
"3\tWhat was this person's role?\tThis person was a member of the Danish royal family.\tWhich group?\tMerchants\tFarmers\tRoyal family\tC",

"5\tWhat was this person's name?\tThe name began with the letter T.\tWhich first letter?\tS\tT\tH\tB"
].join("\n");
function parseStoryRows(raw){
 const lines=raw.trim().split(/\r?\n/).filter(x=>x.trim());
 if(lines.length!==5)throw Error("Exactly 5 question rows are required (found "+lines.length+").");
 return lines.map((line,i)=>{
  const a=line.split("\t").map(x=>x.trim());
  if(a.length!==8)throw Error("Row "+(i+1)+" needs 8 TAB-separated columns; found "+a.length+". Paste directly from a spreadsheet.");
  if(a.some(x=>!x))throw Error("Row "+(i+1)+" contains an empty field.");
  if(a[0]!==String(i+1))throw Error("Question numbers must be 1, 2, 3, 4, 5 in order.");
  const correct="ABC".indexOf(a[7].toUpperCase());
  if(correct<0)throw Error("Row "+(i+1)+" must end with A, B, or C.");
  if(new Set(a.slice(4,7).map(x=>x.toLowerCase())).size!==3)throw Error("Row "+(i+1)+" must have three different answers.");
  return {number:i+1,q:a[1],a:a[2],check:a[3],opts:a.slice(4,7),correct};
 });
}
function buildCustomStory(){
 const title=$("customTitle").value.trim(),premise=$("customIntro").value.trim(),identity=$("customIdentity").value.trim();
 const wrong=$("customWrong").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(!title||!premise||!identity)throw Error("Title, introduction, and correct identity are required.");
 if(wrong.length!==2||new Set([identity,...wrong].map(x=>x.toLowerCase())).size!==3)throw Error("Enter two distinct wrong identities, different from the correct one.");
 const rows=parseStoryRows($("customRows").value);
 const styles=[4,5,6,7,8],names=["The Skald","The Runecarver","The Storykeeper","The Merchant","The Builder"];
 const facts=rows.map((r,i)=>({name:names[i],style:styles[i],label:"CLUE "+(i+1),q:r.q,a:r.a,check:r.check,opts:r.opts,correct:r.correct,clue:r.a}));
 const reconstruction=rows.map(r=>[r.check.replace(/\?$/, "")+" — ____",r.opts,r.correct]);
 return {id:"custom-story",group:"MY STORIES",title,premise,vocab:rows.map(r=>["Question "+r.number,r.q]),facts,reconstruction,fullStory:rows.map(r=>r.a).join(" "),finalQuestion:$("customFinalQuestion").value.trim()||"What is the mystery answer?",finalOptions:[wrong[0],identity,wrong[1]],finalCorrect:1,finale:rows.map(r=>({question:r.check,opts:r.opts,correct:r.correct}))};
}
function showEditorStatus(message,ok=false){$("editorStatus").textContent=message;$("editorStatus").style.color=ok?"#b7edaa":"#f5c19c"}
function installCustomStory(story){const i=ADVENTURES.findIndex(a=>a.id==="custom-story");if(i>=0)ADVENTURES.splice(i,1);ADVENTURES.push(story);populateMenu();$("adventureSelect").value="custom-story";updatePreview()}
function saveStory(){try{captureClue();const story=buildCustomStory();installCustomStory(story);try{localStorage.setItem(CUSTOM_KEY,JSON.stringify({title:$("customTitle").value,intro:$("customIntro").value,identity:$("customIdentity").value,wrong:$("customWrong").value,rows:$("customRows").value,finalQuestion:$("customFinalQuestion").value}))}catch{}showEditorStatus("✓ Story saved and selected! Choose a character and press START ADVENTURE.",true)}catch(e){showEditorStatus("✗ "+e.message)}}
function restoreStory(){try{const v=JSON.parse(localStorage.getItem(CUSTOM_KEY)||"null");if(!v)return;$("customTitle").value=v.title;$("customIntro").value=v.intro;$("customIdentity").value=v.identity;$("customWrong").value=v.wrong;$("customRows").value=v.rows;$("customFinalQuestion").value=v.finalQuestion||"What is the mystery answer?";installCustomStory(buildCustomStory());loadClueRows($("customRows").value)}catch(e){showEditorStatus("Saved story could not be loaded: "+e.message)}}
function populateMenu(){

let editorDirty=false, editorLoading=false;

 if(!a)return;
 editorLoading=true;
 $("customTitle").value=a.title||"";
 $("customFinalQuestion").value=a.finalQuestion||"What is the mystery answer?";
 $("customIdentity").value=a.finalOptions?.[a.finalCorrect]||"";
 $("customIntro").value=a.premise||"";
 $("customWrong").value=(a.finalOptions||[]).filter((_,i)=>i!==a.finalCorrect).slice(0,2).join("\n");
 for(let i=0;i<5;i++){
  const f=a.facts?.[i]||{};
  clueData[i]={q:f.q||"",a:f.a||"",check:f.check||"",opts:[...(f.opts||["","",""])],correct:"ABC"[f.correct??0]};
 }
 activeClue=0;showClue();syncClueRows();editorDirty=false;editorLoading=false;
 showEditorStatus("Adventure loaded. You can edit every field before playing.",true);
}
function confirmReplace(){return !editorDirty||confirm("Replace your unsaved story edits with the selected adventure?")}

const clueData=Array.from({length:5},()=>({q:"",a:"",check:"",opts:["","",""],correct:"A"}));

function captureClue(){if(!editorLoading)editorDirty=true;const c=clueData[activeClue];c.q=$("clueQuestion").value;c.a=$("clueAnswer").value;c.check=$("clueCheck").value;c.opts=[$("clueA").value,$("clueB").value,$("clueC").value];c.correct=$("clueCorrect").value;syncClueRows();renderClueTabs()}
function syncClueRows(){$("customRows").value=clueData.map((c,i)=>[i+1,c.q,c.a,c.check,...c.opts,c.correct].join("\t")).join("\n")}
function renderClueTabs(){$("clueTabs").innerHTML=clueData.map((c,i)=>`<button type="button" class="clueTab ${i===activeClue?'active':''} ${c.q&&c.a&&c.check&&c.opts.every(Boolean)?'complete':''}" data-i="${i}">${i+1}</button>`).join("");$("clueCounter").textContent=`Clue ${activeClue+1} / 5`;document.querySelectorAll('.clueTab').forEach(b=>b.onclick=()=>{captureClue();activeClue=Number(b.dataset.i);showClue()})}

function importStoryScript(raw){const lines=raw.replace(/\r/g,"").split("\n");const keys=["TITLE","INTRO","IDENTITY","WRONG1","WRONG2"];if(lines.length<11||lines[5]!=="QUESTIONS")throw Error("Invalid script header. Expected TITLE, INTRO, IDENTITY, WRONG1, WRONG2, QUESTIONS.");const vals=keys.map((k,i)=>{const a=lines[i].split("\t");if(a[0]!==k)throw Error("Expected "+k+" on line "+(i+1));return a.slice(1).join("\t")});$("customTitle").value=vals[0];$("customIntro").value=vals[1];$("customIdentity").value=vals[2];$("customWrong").value=vals[3]+"\n"+vals[4];const qlines=lines.slice(6);const fq=qlines.findIndex(x=>x.startsWith("FINALQUESTION\t"));if(fq>=0){$("customFinalQuestion").value=qlines[fq].slice(14);qlines.splice(fq,1)}$("customRows").value=qlines.join("\n").trim();loadClueRows($("customRows").value);saveStory()}
